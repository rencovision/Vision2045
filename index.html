<style>
:root{--bg:#1a1405;--card:#1f1805;--tx:#fff8e6;--mut:#cdbf93;--pri:#c9a227;--acc:#e3c04a;--grn:#a0a24a;--bd:#4a3d12;--red:#ef6b5c;--grad:linear-gradient(90deg,#f5e08a,#e3c04a,#c79a1e)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
.hero{background:var(--bg);text-align:center;padding:14px 16px 10px;border-bottom:2px solid transparent;border-image:var(--grad) 1}
.hero img{width:150px;height:150px;object-fit:contain;display:block;margin:0 auto}
.hero small{letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--mut)}
.hc{background:var(--grad);color:#3a2a00;border-radius:13px;padding:13px;margin-bottom:10px}
main{max-width:820px;margin:0 auto;padding:14px}
h2{font-size:17px;margin:4px 0 10px;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:13px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.st{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:12px}
.st b{display:block;font-size:22px;color:var(--pri)}.st span{font-size:12px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mut{color:var(--mut);font-size:13px}
.b{background:var(--pri);color:#3a2a00;border:0;border-radius:9px;padding:9px 13px;font:600 14px inherit;cursor:pointer}
.b.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.b.y{background:var(--acc);color:#221b05}
.l{background:none;border:0;color:var(--pri);cursor:pointer;font:600 13px inherit;padding:4px 6px}.l.r{color:var(--red)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:13px;font-weight:600;margin:9px 0 3px}
label.ck{display:flex;gap:8px;align-items:center;font-weight:500;font-size:15px;margin:2px 0;padding:6px 0;border-bottom:1px solid var(--bd)}label.ck input{width:auto}
.bar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--grad)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bd);margin-right:4px}
.in{color:var(--pri);font-weight:700}.out{color:var(--red);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1 0 62px;background:none;border:0;padding:8px 2px;color:var(--mut);font:600 11px inherit;cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{color:var(--pri)}
#m,#lock{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
#m.on,#lock.on{display:flex}#lock{background:var(--bg);align-items:center;z-index:20}
.box{background:var(--card);border:1px solid var(--bd);width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:16px;border-radius:16px 16px 0 0}
#lock .box{border-radius:16px;margin:16px;text-align:center}
.bt{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

body{background:radial-gradient(800px 380px at 85% -8%,rgba(201,162,39,.13),transparent),radial-gradient(600px 380px at -10% 8%,rgba(227,192,74,.07),transparent),var(--bg);background-attachment:fixed;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(26,20,5,.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad)}
#hlogo{width:46px;height:46px;object-fit:contain}
.ht{flex:1;line-height:1.2;min-width:0}.ht b{font:700 17px Georgia,serif}.ht b span,.lg h1{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.ht small{display:block;color:var(--mut);font-size:11px}
.chip{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:3px 10px 3px 3px;color:var(--tx);font:600 12px inherit;cursor:pointer;text-align:left}.chip em{display:block;font-style:normal;color:var(--mut);font-size:10px;font-weight:500}
.ib{background:var(--card);border:1px solid var(--bd);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:15px}
.av{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#3a2a00;font-weight:800}.av.s{width:28px;height:28px;font-size:12px}
.card{background:linear-gradient(160deg,#2a2008,#1a1405);box-shadow:0 6px 20px rgba(0,0,0,.35);transition:border-color .15s}.card:hover{border-color:#5a4a1a}
.st{background:linear-gradient(160deg,#2a2008,#1a1405);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.ic{font-style:normal;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(201,162,39,.13);margin-bottom:8px}
main>*,#lst>*{animation:up .35s both}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.b{transition:transform .1s,filter .15s}.b:active{transform:scale(.97)}.b:hover{filter:brightness(1.1)}
.b.y{background:var(--grad);color:#3a2a00}
nav{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));border:1px solid var(--bd);border-radius:20px;background:rgba(26,20,5,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-bottom:0;box-shadow:0 10px 30px rgba(0,0,0,.55);max-width:700px;margin:0 auto}

.mc{display:flex;gap:12px}.tag.ok{background:rgba(160,162,74,.16);color:var(--grn)}.tag.off{background:rgba(239,107,92,.15);color:var(--red)}
#auth{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;overflow:auto;padding:20px;background:radial-gradient(600px 420px at 50% 0,rgba(201,162,39,.22),transparent),radial-gradient(500px 400px at 100% 100%,rgba(227,192,74,.14),transparent),var(--bg)}#auth.on{display:flex}
